name: Flake watch

# Watch the guarded first-run cases for cold-start flakiness.
# Keeping this workflow on `schedule` / `workflow_dispatch` only means the
# repeats never lengthen regular push or pull request CI.
on:
  schedule:
    # Daily at 03:17 UTC; off the top of the hour to avoid GitHub's peak.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-first-run:
    name: guarded first-run stability
    runs-on: ubuntu-latest
    # Five cold runs of each guarded case plus dependency install and the
    # build.
    timeout-minutes: 30
    # Issue #213: reuse the pinned official Playwright image from the `verify`
    # job in ci.yml instead of installing WebKit and its apt dependencies at
    # runtime. The image already contains Chromium and WebKit, so the
    # scheduled watch has no `playwright install`, `--with-deps` or apt step.
    # The tag is derived from `@playwright/test` in package-lock.json and the
    # digest pins the exact multi-arch image;
    # tests/unit/flake-watch-workflow.test.ts fails when this drifts from
    # PLAYWRIGHT_IMAGE_PIN or from the verify job.
    #
    # Image pull happens during container setup, before any step: a missing
    # tag/digest or an unreachable registry fails the job there with the Docker
    # pull error, still inside the unchanged 30-minute budget.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      # GitHub container jobs default to a 64 MB /dev/shm. WebKit crashes
      # intermittently when it fills, so share the host IPC namespace like the
      # verify job and scripts/run-container-capture.mjs do (Issue #213).
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Repeat the guarded first-run cases five times
        id: flake-watch
        env:
          CI: 'true'
        # One command guards all three cases without widening the grep:
        # --project=mobile-webkit matches only the *.webkit.spec.ts entry points
        # (hub and blank canvas, restarting from the sidebar) and
        # --project=chromium matches only framework.spec.ts (reset centres the
        # cursor), because each project excludes the other project's specs.
        # --retries=0 keeps every repeat a first run, so a cold-start failure
        # cannot be hidden by a retry.
        # --trace=retain-on-failure keeps the trace even though retries are
        # disabled.
        run: |
          npx playwright test \
            --project=mobile-webkit \
            --project=chromium \
            -g "hub and blank canvas|reset centres the cursor and keyboard keeps working afterwards|restarting from the sidebar focuses the visible compact restart on a phone" \
            --repeat-each=5 \
            --retries=0 \
            --trace=retain-on-failure

      - name: Summarize first-run results
        if: always()
        env:
          FLAKE_WATCH_OUTCOME: ${{ steps.flake-watch.outcome }}
        run: node scripts/flake-watch-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-watch-playwright-report
          # JSON report, failure screenshots and retained traces all live here.
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
