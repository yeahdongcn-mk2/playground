name: Flake watch

# Watch the guarded mobile-webkit framework case for first-run flakiness.
# Keeping this workflow on `schedule` / `workflow_dispatch` only means the
# repeats never lengthen regular push or pull request CI.
on:
  schedule:
    # Daily at 03:17 UTC; off the top of the hour to avoid GitHub's peak.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-webkit-first-run:
    name: mobile-webkit first-run stability
    runs-on: ubuntu-latest
    # Five cold runs of the hub case plus dependency and browser installs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure apt Acquire retries and timeouts
        run: |
          set -euo pipefail
          sudo tee /etc/apt/apt.conf.d/99-ci-acquire >/dev/null <<'EOF'
          Acquire::Retries "1";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright WebKit
        # The bounded wrapper retries transient apt/DNS failures, kills a hung
        # install and exits non-zero within this step timeout, so the 30-minute
        # job keeps enough time for the five repeats.
        run: node scripts/install-playwright-ci.mjs webkit
        timeout-minutes: 8

      - name: Production build
        run: npm run build

      - name: Repeat the mobile-webkit hub case five times
        id: flake-watch
        env:
          CI: 'true'
        # --retries=0 keeps every repeat a first run, so a cold-start failure
        # cannot be hidden by a retry. --trace=retain-on-failure keeps the
        # trace even though retries are disabled.
        run: |
          npx playwright test \
            --project=mobile-webkit \
            -g "hub and blank canvas" \
            --repeat-each=5 \
            --retries=0 \
            --trace=retain-on-failure

      - name: Summarize first-run results
        if: always()
        env:
          FLAKE_WATCH_OUTCOME: ${{ steps.flake-watch.outcome }}
        run: node scripts/flake-watch-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-watch-playwright-report
          # JSON report, failure screenshots and retained traces all live here.
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
