name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Issue #213: run every step in the official Playwright image instead of
    # installing Chromium, WebKit and their apt dependencies at runtime. The
    # tag is derived from `@playwright/test` in package-lock.json and the digest
    # pins the exact multi-arch image; tests/unit/ci-workflow.test.ts fails when
    # either drifts, so a Playwright bump must update PLAYWRIGHT_IMAGE_PIN, this
    # image and the capture Dockerfile together.
    #
    # Image pull happens during container setup, before any step: a missing
    # tag/digest or an unreachable registry fails the job there with the Docker
    # pull error, still inside the unchanged 20-minute budget. The bounded
    # `scripts/install-playwright-ci.mjs` fallback from Issue #202 stays in the
    # repository (flake-watch.yml still uses it) so this change can be rolled
    # back without losing the retry/timeout behavior.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python for pre-commit
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit==4.7.0

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-4.7.0-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-4.7.0-

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and module boundaries
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit -- --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/vitest-report.json"

      - name: Verify doc test counts
        run: npm run verify:doc-counts -- --report "$RUNNER_TEMP/vitest-report.json"

      - name: Screenshot doc dimensions
        run: npm run verify:screenshots:doc-dims

      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: npm run check:budget

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Check target e2e flakes
        run: node scripts/check-e2e-flakes.mjs

      - name: WebKit narrow screenshot smoke test
        run: |
          set -euo pipefail
          rm -f docs/screenshots/after-minesweeper-webkit-narrow-*.png
          npm run screenshots:minesweeper:webkit-narrow 2>&1 | tee "$RUNNER_TEMP/minesweeper-webkit-narrow.log"
          node scripts/verify-screenshot-artifacts.mjs --manifest docs/screenshots/ci-webkit-narrow-manifest.json --log "$RUNNER_TEMP/minesweeper-webkit-narrow.log"
