# Baseline pre-commit checks shared by local contributors and CI.
#
# Usage:
#   pip install pre-commit   (or: pipx install pre-commit)
#   pre-commit install
#   pre-commit run --all-files
#
# The hook repository is pinned to a stable release; bump `rev` deliberately.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        # The repository intentionally stores four UI screenshots between
        # ~1.56 MB and ~2.33 MB under docs/screenshots/. The hook's default
        # 500 KB limit would reject those existing files on every commit.
        # Instead of excluding docs/screenshots/ wholesale (which would also
        # hide accidentally committed giant captures), the ceiling is raised
        # to 4 MB: enough headroom for current documentation evidence, while
        # still catching abnormal binaries (current largest is ~2.33 MB).
        # `--enforce-all` makes `pre-commit run --all-files` (and CI) inspect
        # every tracked file, not just files staged as additions.
        args: ['--maxkb=4096', '--enforce-all']
      - id: check-merge-conflict

  # Secret scanning for every text file the hook receives. `pre-commit` passes
  # each selected filename as an argument, so `pre-commit run --all-files`
  # scans the whole tracked tree (not just staged changes), including a clean
  # checkout.
  #
  # This hook stays local instead of using the upstream gitleaks/detect-secrets
  # entries: gitleaks' default hook entry is `gitleaks git ... --staged`, which
  # finds nothing in a clean checkout, and detect-secrets needs a Python
  # environment that the Node-only unit test suite cannot exercise. The local
  # entry is filename-based, uses the repository's existing Node runtime, and
  # installs nothing extra. False positives are narrowed with `exclude` and
  # `types`; the scan itself is never disabled.
  - repo: local
    hooks:
      - id: secret-scan
        name: scan text files for secrets
        entry: node scripts/scan-secrets.mjs
        language: system
        # Known deterministic false positives: generated npm integrity hashes
        # in the lockfile, and the binary PNG captures under docs/screenshots/.
        # `types: [text]` already drops the PNGs; the explicit PNG exclude is a
        # defensive backstop. Only these paths are narrowed, so text files in
        # the docs tree (for example docs/screenshots/README.md) stay scanned.
        types: [text]
        exclude: '^(?:package-lock\.json|docs/screenshots/.*\.png)'
